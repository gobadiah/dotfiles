# 2026-10-29: streaming from Japan (NAS in France, ~300 ms RTT, 4-13 Mbit/s with dips below a
# 6 Mbit/s file's bitrate). mpv's default cache-pause-wait=1 resumes after only 1 s of buffer,
# so every dip became a pause/play every second. Buffer much more, and resume only after 15 s.
cache=yes
cache-secs=600
demuxer-max-bytes=800MiB
demuxer-max-back-bytes=100MiB
demuxer-readahead-secs=600
cache-pause=yes
cache-pause-initial=yes
cache-pause-wait=15
